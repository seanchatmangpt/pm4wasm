[project]
name = "pm4wasm"
version = "0.1.0"
description = "GGEN manufacturing contract for pm4wasm POWL/WASM capability reference"

[ontology]
source = "ontology/ggen-powl-capabilities.ttl"
base_iri = "https://pm4wasm.dev/ontology/ggen#"

[ontology.prefixes]
pm = "https://pm4wasm.dev/ontology/ggen#"
skos = "http://www.w3.org/2004/02/skos/core#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"

[inference]

[[inference.rules]]
name = "powl-capability-projection"
construct = """
PREFIX pm: <https://pm4wasm.dev/ontology/ggen#>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
CONSTRUCT {
  ?cap a skos:Concept ;
       skos:prefLabel ?label ;
       dcterms:description ?description ;
       pm:artifact ?artifact ;
       pm:runtime ?runtime ;
       pm:authority ?authority .
}
WHERE {
  ?cap a skos:Concept ;
       skos:prefLabel ?label ;
       dcterms:description ?description ;
       pm:artifact ?artifact ;
       pm:runtime ?runtime ;
       pm:authority ?authority .
}
ORDER BY ?label
"""

[generation]
output_dir = "."

[[generation.rules]]
name = "powl-capabilities-reference"
query = { inline = """
PREFIX pm: <https://pm4wasm.dev/ontology/ggen#>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
SELECT ?label ?description ?artifact ?runtime ?authority
WHERE {
  ?cap a skos:Concept ;
       skos:prefLabel ?label ;
       dcterms:description ?description ;
       pm:artifact ?artifact ;
       pm:runtime ?runtime ;
       pm:authority ?authority .
}
ORDER BY ?label
""" }
template = { file = "templates/ggen-powl-capabilities.md.tera" }
output_file = "docs/reference/ggen-powl-capabilities.md"
mode = "Overwrite"
